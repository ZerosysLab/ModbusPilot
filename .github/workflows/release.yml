name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=ModbusPilot_v${VERSION}_Win64" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ModbusPilot.sln

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish ModbusPilot.App/ModbusPilot.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish_out/${{ steps.ver.outputs.zip_name }}

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "publish_out/${{ steps.ver.outputs.zip_name }}/*" -DestinationPath "${{ steps.ver.outputs.zip_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ModbusPilot ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.ver.outputs.zip_name }}.zip
